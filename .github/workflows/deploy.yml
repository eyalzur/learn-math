name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # The notebook server on Cloud Run (docs/features/notebook-server-relay/).
          # Deliberately in plain text and not a secret: the browser has to know this
          # address to call it, so it ends up in the published bundle either way — and
          # the service is intentionally public (--allow-unauthenticated, see
          # server/README.md for why). Keeping it here means the address the live site
          # uses is version-controlled and reviewable, not hidden in a repo setting.
          VITE_NOTEBOOK_SERVER_URL: https://notebook-server-864901299725.me-west1.run.app
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
