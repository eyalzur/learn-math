name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # The notebook server on Cloud Run (docs/features/notebook-server-relay/).
          # Deliberately in plain text and not a secret: the browser has to know this
          # address to call it, so it ends up in the published bundle either way — and
          # the service is intentionally public (--allow-unauthenticated, see
          # server/README.md for why). Keeping it here means the address the live site
          # uses is version-controlled and reviewable, not hidden in a repo setting.
          VITE_NOTEBOOK_SERVER_URL: https://notebook-server-864901299725.me-west1.run.app
          # The Hebrew math-aware TTS server on Cloud Run (docs/features/hebrew-math-tts/).
          # Same reasoning as VITE_NOTEBOOK_SERVER_URL above: the browser must know this
          # address to call it, so it's in the published bundle regardless — keeping it
          # here keeps it version-controlled and reviewable. Service is public
          # (--allow-unauthenticated, see server/README.md).
          VITE_HEBREW_TTS_SERVER_URL: https://hebrew-tts-server-864901299725.me-west1.run.app
      # The two-app version (kids at /next/, parents at /next/parents/), built a second time and
      # published beside the live site, which it does not touch. Only when its server address is
      # set (repository variable NEXT_API_URL — api/README.md, step 4); before that this is a no-op.
      - name: Build the two-app version under /next/
        if: ${{ vars.NEXT_API_URL != '' }}
        env:
          VITE_BASE: /learn-math/next/
          VITE_CLOUD: "1"
          VITE_API_URL: ${{ vars.NEXT_API_URL }}
          # Public identifiers, not secrets (Firebase security comes from the server's checks).
          VITE_FIREBASE_CONFIG: ${{ vars.NEXT_FIREBASE_CONFIG }}
          VITE_KIDS_MANIFEST: manifest-kids.json
        run: |
          npx vite build --outDir dist-next
          mv dist-next dist/next

        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
