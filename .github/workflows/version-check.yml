name: Version bump check

on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The check compares against the base branch, so the shallow default clone is
          # not enough.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: git fetch origin "${{ github.base_ref }}"
      - run: node scripts/check-version-bump.mjs "${{ github.base_ref }}" "${{ github.head_ref }}"
