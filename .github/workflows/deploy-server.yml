name: Deploy server to Cloud Run

# Deliberately no `paths:` filter, even though this only ever deploys server/.
# A paths filter produces no run at all when nothing under server/ changed — which makes
# "nothing needed deploying" and "this broke before it started" look identical from the
# Actions list: both are simply absent. The person reading that list is not a programmer,
# and the failure this whole workflow exists to prevent is exactly the silent one (a
# merged server change that never reached Cloud Run, with nothing on screen saying so).
# So the run always happens, decides for itself whether there is anything to deploy, and
# says which. The cost is a few seconds per push; the gain is that a *missing* run becomes
# a signal in its own right.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # Required for Workload Identity Federation: this is what lets the job mint the OIDC
  # token Google verifies. Without it authentication fails with an error that does not
  # mention permissions at all, which sends whoever reads it looking in the wrong place.
  id-token: write

concurrency:
  group: deploy-server
  # Note this is the opposite of deploy.yml, on purpose. Publishing to Pages uploads a
  # whole self-contained snapshot, so cancelling a superseded run loses nothing. A Cloud
  # Run deploy is a build followed by a traffic switch; cancelling midway can leave a
  # half-finished build and an unclear idea of which revision is actually serving.
  # Queue them instead.
  cancel-in-progress: false

env:
  # Neither of these is a secret, which is the whole point of Workload Identity
  # Federation: they are identifiers, not credentials. Google grants access only to an
  # OIDC token it has verified came from this exact repository, so holding these strings
  # without such a token is worth nothing. Keeping them here rather than in repository
  # settings means the setup is one terminal session with nothing to paste into a second
  # UI — the step most likely to go wrong — and the values stay reviewable in git.
  WIF_PROVIDER: projects/864901299725/locations/global/workloadIdentityPools/github/providers/github
  SERVICE_ACCOUNT: github-deployer@learn-math-506923.iam.gserviceaccount.com
  SERVICE_NAME: notebook-server
  REGION: me-west1
  # The identity notebook-server itself runs as at runtime — not SERVICE_ACCOUNT above,
  # which is who *performs* the deploy. Passed explicitly on every deploy below: `gcloud
  # run deploy` without --service-account does not reliably carry the previous revision's
  # service account forward, discovered the hard way on 2026-08-31 when an automated
  # deploy silently reset this service to the project's default compute account, breaking
  # its Workload Identity Federation trust with Anthropic. See server/README.md.
  RUNTIME_SERVICE_ACCOUNT: notebook-server-claude@learn-math-506923.iam.gserviceaccount.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The change check below compares two commits. A shallow clone does not contain
          # the earlier one.
          fetch-depth: 0

      - id: changed
        name: Did anything under server/ change?
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then
            # A manual run is an explicit request to deploy. Checking for changes would
            # make the button do nothing most of the time, which is not what it is for.
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif [ -z "${{ github.event.before }}" ] || [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            # First push to the branch, or a force-push: there is no usable "before" to
            # compare against.
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "${{ github.event.before }}" "${{ github.sha }}" -- server/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            # Also the branch taken when git cannot resolve the old commit at all (it was
            # force-pushed away), since that exits non-zero too. Every uncertain case ends
            # up here on purpose: a redundant deploy costs two minutes, while wrongly
            # skipping one recreates the exact silent-staleness bug this workflow prevents.
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Report that there was nothing to deploy
        if: steps.changed.outputs.changed != 'true'
        run: |
          # Written to the step summary, not only the log: the summary shows on the run's
          # own page, so the answer is visible without opening and scrolling a log.
          echo "no changes under server/ — nothing to deploy" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: google-github-actions/auth@v2
        if: steps.changed.outputs.changed == 'true'
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2
        if: steps.changed.outputs.changed == 'true'

      - name: Deploy to Cloud Run
        if: steps.changed.outputs.changed == 'true'
        run: |
          # --quiet because there is nobody here to answer the prompts gcloud asks on a
          # first deploy; without it the run hangs until it times out.
          gcloud run deploy "$SERVICE_NAME" \
            --source server/ \
            --region "$REGION" \
            --service-account "$RUNTIME_SERVICE_ACCOUNT" \
            --allow-unauthenticated \
            --quiet

          url="$(gcloud run services describe "$SERVICE_NAME" --region "$REGION" --format='value(status.url)')"
          echo "deployed: $url" | tee -a "$GITHUB_STEP_SUMMARY"

      # Runs last and only on failure, so it appears after gcloud's own output rather than
      # instead of it. The three causes are not guesses: the first two are what actually
      # went wrong during the first manual deploy on 2026-08-29, in this order.
      - name: Explain what to check
        if: failure()
        run: |
          cat <<'EOF' | tee -a "$GITHUB_STEP_SUMMARY"
          deploy failed. the usual causes, in order of likelihood:
            1. the GitHub->Google Cloud permission expired or was removed
            2. the billing account got unlinked from the project
            3. the server code itself does not build
          see: server/README.md, section "פריסה אוטומטית — הגדרה חד-פעמית"
          EOF
