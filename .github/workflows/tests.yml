name: Tests

on:
  pull_request:
  # Also on main, and not only on pull requests: two changes that are each fine on their
  # own can break together, and main deploys straight to the live site. A break there has
  # to surface immediately, not wait for whoever opens the next pull request.
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # GitHub's runner ships no browser. Without this every UI test fails on a missing
      # executable, which reads like a code failure and sends whoever looks at it the
      # wrong way entirely.
      - run: npx playwright install --with-deps chromium

      - run: npm run build
      - run: npm run lint
      - run: npm run test:e2e

      # The report is what makes a red run diagnosable without re-running it locally.
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
