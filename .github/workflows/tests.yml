name: Tests

on:
  pull_request:
  # Also on main, and not only on pull requests: two changes that are each fine on their
  # own can break together, and main deploys straight to the live site. A break there has
  # to surface immediately, not wait for whoever opens the next pull request.
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    # Split across 4 isolated runners instead of 1 — each gets its own checkout, its own
    # build, and its own dev server (no server-sharing flake, see CLAUDE.md's "שתי ריצות
    # מקבילות" section — that's about *one* server with several workers against it;
    # sharding here gives each shard a server of its own, the same as two people each
    # running `npm run test:e2e` on their own machine). Was a single ~20-30 minute job;
    # this is the e2e-speed follow-up from fix/feedback-celebration-and-hints
    # (2026-11-24), together with the fake-clock fixes in the individual spec files for
    # the handful of tests that used to be the suite's biggest single cost
    # (grade8-angles-congruence.spec.ts alone dropped from ~15 real minutes to under 2).
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # GitHub's runner ships no browser. Without this every UI test fails on a missing
      # executable, which reads like a code failure and sends whoever looks at it the
      # wrong way entirely.
      - run: npx playwright install --with-deps chromium

      - run: npm run build
      # Lint is cheap and the same on every shard — running it once, on shard 1 only,
      # keeps the other three shards from redoing identical work for no reason.
      - if: matrix.shard == 1
        run: npm run lint
      - run: npx playwright test --shard=${{ matrix.shard }}/4

      # The report is what makes a red run diagnosable without re-running it locally.
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7
